# このファイルが設定の唯一の情報源です。
# sync.yml のビルドマトリクスと AVAILABLE_BOARDS.md の生成は
# どちらもこのファイルを読み込みます。
#
# - platform: 配信URLの一部になる識別子 (package_custom_<platform>_index.json)
# - json_url: 公式のボードマネージャー index JSON
# - targets:  残したい Board ID のカンマ区切り。空文字なら無改造ミラー
#
# packager_suffix: 公式パッケージ名との衝突を避けるため、
# packages[0].name に付与する接尾辞 (例: rp2040 -> rp2040-trimmed)。
# これにより公式URLと本リポジトリのURLを両方登録しても
# Arduino IDE 上で別パッケージとして安全に共存できます。

packager_suffix: trimmed

platforms:
  - platform: rp2040
    json_url: https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
    targets: rpipico,rpipicow,rpipico2,rpipico2w,seeed_xiao_rp2040,seeed_xiao_rp2350,vccgnd_yd_rp2040,waveshare_rp2040_zero,waveshare_rp2350_zero,generic,generic_rp2350

  - platform: esp32
    json_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    targets: esp32,esp32s3,XIAO_ESP32S3

  - platform: bluepad32
    json_url: https://raw.githubusercontent.com/ricardoquesada/esp32-arduino-lib-builder/master/bluepad32_files/package_esp32_bluepad32_index.json
    targets: ''
