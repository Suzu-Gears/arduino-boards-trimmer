name: Sync Custom Cores

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'platforms.yml'
      - 'scripts/**'
      - '.github/workflows/sync.yml'

permissions:
  contents: write

# schedule と手動実行の同時走行によるレースを防ぐ
concurrency:
  group: sync-custom-cores
  cancel-in-progress: false

jobs:
  load-config:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      packager_suffix: ${{ steps.set-matrix.outputs.packager_suffix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml packaging

      - name: Build matrix from platforms.yml
        id: set-matrix
        run: |
          echo "matrix=$(python scripts/filter_core.py --matrix)" >> "$GITHUB_OUTPUT"
          echo "packager_suffix=$(python -c "import yaml; print(yaml.safe_load(open('platforms.yml')).get('packager_suffix','trimmed'))")" >> "$GITHUB_OUTPUT"

  build-custom-cores:
    needs: load-config
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.load-config.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml packaging

      - name: Get latest version
        id: get_version
        env:
          PLATFORM_NAME: ${{ matrix.platform }}
          JSON_URL: ${{ matrix.json_url }}
        run: python scripts/filter_core.py --get-version

      - name: Check if release exists
        id: check_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          TAG_NAME="${{ matrix.platform }}-${VERSION}"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "schedule" ] && gh release view "$TAG_NAME" > /dev/null 2>&1; then
            echo "Release $TAG_NAME already exists. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build custom core
        if: steps.check_release.outputs.skip == 'false'
        env:
          PLATFORM_NAME: ${{ matrix.platform }}
          JSON_URL: ${{ matrix.json_url }}
          TARGET_BOARDS: ${{ matrix.targets }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PACKAGER_SUFFIX: ${{ needs.load-config.outputs.packager_suffix }}
        run: python scripts/filter_core.py --build

      - name: Create or update Release
        if: steps.check_release.outputs.skip == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ steps.check_release.outputs.tag_name }}"
          shopt -s nullglob
          ASSETS=(*.tar.gz)
          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "Mirror mode: no release asset to upload."
            exit 0
          fi
          # delete/create ではなく upload --clobber を使うことで、
          # 既存リリースのURLが 404 になる時間帯を作らない
          if gh release view "$TAG_NAME" > /dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG_NAME" \
              --title "Custom Core $TAG_NAME" \
              --notes "Automated release of custom $TAG_NAME core" \
              "${ASSETS[@]}"
          fi

      - name: Publish JSON to gh-pages
        if: steps.check_release.outputs.skip == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p gh-pages-workdir
          cd gh-pages-workdir

          git init
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git fetch origin gh-pages || true

          if git ls-remote --heads origin gh-pages | grep -q gh-pages; then
            git checkout gh-pages
          else
            git checkout -b gh-pages
          fi

          cp "../package_custom_${{ matrix.platform }}_index.json" .
          git add "package_custom_${{ matrix.platform }}_index.json"

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update ${{ matrix.platform }} index"

          # matrix 並列での push 競合に備えたリトライ
          for i in {1..5}; do
            if git push origin gh-pages; then
              echo "Successfully pushed to gh-pages"
              exit 0
            fi
            echo "Push failed, retrying after pulling..."
            git pull --rebase origin gh-pages
            sleep $((RANDOM % 10 + 5))
          done

          echo "Failed to push to gh-pages after 5 retries."
          exit 1
