name: Update Available Boards

on:
  push:
    paths:
      - '.github/workflows/sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Run update script
        run: |
          python scripts/update_board_list.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add AVAILABLE_BOARDS.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: Update AVAILABLE_BOARDS.md based on sync.yml changes"
            for i in {1..5}; do
              if git push; then
                echo "Successfully pushed"
                exit 0
              fi
              echo "Push failed, retrying after pulling..."
              git pull --rebase
              sleep $((RANDOM % 5 + 2))
            done
            echo "Failed to push after 5 retries."
            exit 1
          fi
